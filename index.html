<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>帳戶挑選器（第三版）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 font-sans select-none pb-12">
  <div class="max-w-xl mx-auto">
    <div class="sticky top-0 bg-slate-50 pt-1 pb-3 z-10">
      <div class="mb-2 rounded-xl bg-emerald-50 border border-emerald-200 px-3 py-2 text-xs text-emerald-800">
        GitHub Pages 只負責託管這個帳戶挑選頁；真正把帳戶訊息送回 LINE 聊天室的仍然是 LIFF。
      </div>

      <div class="relative">
        <input type="text" id="searchInput" placeholder="🔍 搜尋帳戶名稱（例：富邦、現金）..."
          class="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm text-sm">
        <button id="clearBtn" class="hidden absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 text-sm">✕</button>
      </div>

      <div id="statusBar" class="mt-2 text-xs text-slate-500">正在載入帳戶清單...</div>

      <div class="flex gap-2 overflow-x-auto no-scrollbar mt-2.5 py-1" id="categoryChips"></div>
    </div>

    <div id="accountList" class="space-y-2 mt-1"></div>
  </div>

  <script>
    // ===== 你需要自行修改的設定 =====
    const LIFF_ID = '2012182113-Is0rZCfR';
    // 部署 GAS Web App 後，把下面換成你的 exec 網址
    const ACCOUNT_API_BASE = 'https://script.google.com/macros/s/AKfycbyBZybZf64r0734nbE0kd3-twXyGFGk-mPTRUUDeWsxoTkUpaxzasxZC-nln9aJtg5L/exec';

    // 若 GAS 端暫時抓不到，會退回這份保底資料。
    const FALLBACK_ACCOUNTS = [
      { name: '富邦J卡', category: '信用卡' },
      { name: '玉山Pi卡', category: '信用卡' },
      { name: '樂天玫瑰卡', category: '信用卡' },
      { name: '元大銀行', category: '台幣銀行' },
      { name: '台新銀行', category: '台幣銀行' },
      { name: '將來銀行', category: '數位帳戶' },
      { name: '現金', category: '票證儲值' },
      { name: '元大證券', category: '其他負債' }
    ];

    let allAccounts = [];
    let currentCategory = 'ALL';
    let liffReady = false;

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        liffReady = true;
      } catch (err) {
        console.error('LIFF 初始化失敗', err);
        setStatus('LIFF 初始化失敗，仍可檢視帳戶，但無法保證可送回 LINE。', true);
      }

      setupSearchAndChips();
      loadAccounts();
    }

    function loadAccounts() {
      if (!ACCOUNT_API_BASE.includes('PUT_YOUR_WEB_APP_DEPLOYMENT_ID_HERE')) {
        const callbackName = 'receiveAccountsFromGas';
        window[callbackName] = function(payload) {
          if (payload && payload.ok && Array.isArray(payload.items) && payload.items.length) {
            allAccounts = normalizeAccounts(payload.items);
            setStatus(`已載入 ${payload.count} 筆帳戶（來自 GAS 動態資料）`);
          } else {
            allAccounts = normalizeAccounts(FALLBACK_ACCOUNTS);
            setStatus('GAS 未回傳有效帳戶資料，已改用保底清單。', true);
          }
          renderCategoryChips();
          filterAndDisplay();
        };

        const script = document.createElement('script');
        script.src = `${ACCOUNT_API_BASE}?action=accounts&callback=${callbackName}&_=${Date.now()}`;
        script.onerror = function() {
          allAccounts = normalizeAccounts(FALLBACK_ACCOUNTS);
          setStatus('無法連線至 GAS 帳戶 API，已改用保底清單。', true);
          renderCategoryChips();
          filterAndDisplay();
        };
        document.body.appendChild(script);
      } else {
        allAccounts = normalizeAccounts(FALLBACK_ACCOUNTS);
        setStatus('尚未填入 GAS 帳戶 API 網址，目前使用保底清單。', true);
        renderCategoryChips();
        filterAndDisplay();
      }
    }

    function normalizeAccounts(items) {
      const map = new Map();
      items.forEach(item => {
        const name = String(item.name || '').trim();
        const category = String(item.category || '未分類').trim() || '未分類';
        if (!name) return;
        if (!map.has(name)) map.set(name, { name, category });
      });
      return [...map.values()];
    }

    function setupSearchAndChips() {
      document.getElementById('searchInput').addEventListener('input', (e) => {
        document.getElementById('clearBtn').classList.toggle('hidden', !e.target.value);
        filterAndDisplay();
      });

      document.getElementById('clearBtn').addEventListener('click', () => {
        const input = document.getElementById('searchInput');
        input.value = '';
        document.getElementById('clearBtn').classList.add('hidden');
        filterAndDisplay();
      });
    }

    function renderCategoryChips() {
      const chipsRoot = document.getElementById('categoryChips');
      chipsRoot.innerHTML = '';
      const categories = ['ALL', ...new Set(allAccounts.map(x => x.category))];

      categories.forEach(cat => {
        const button = document.createElement('button');
        button.className = chipClass(cat === currentCategory);
        button.textContent = cat === 'ALL' ? '全部' : cat;
        button.dataset.cat = cat;
        button.addEventListener('click', () => {
          currentCategory = cat;
          renderCategoryChips();
          filterAndDisplay();
        });
        chipsRoot.appendChild(button);
      });
    }

    function chipClass(active) {
      return active
        ? 'px-3 py-1 rounded-full text-xs font-medium bg-emerald-600 text-white whitespace-nowrap'
        : 'px-3 py-1 rounded-full text-xs font-medium bg-white text-slate-600 border border-slate-200 whitespace-nowrap';
    }

    function filterAndDisplay() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const root = document.getElementById('accountList');
      root.innerHTML = '';

      const filtered = allAccounts.filter(item => {
        const hitKeyword = item.name.toLowerCase().includes(keyword) || item.category.toLowerCase().includes(keyword);
        const hitCategory = currentCategory === 'ALL' || item.category === currentCategory;
        return hitKeyword && hitCategory;
      });

      if (!filtered.length) {
        root.innerHTML = '<div class="text-center py-8 text-slate-400 text-sm">找不到符合的帳戶</div>';
        return;
      }

      filtered.forEach(acc => {
        const button = document.createElement('button');
        button.className = 'w-full text-left px-4 py-3 bg-white hover:bg-emerald-50 active:bg-emerald-100 border border-slate-200 rounded-xl shadow-sm transition flex justify-between items-center group';
        button.innerHTML = `
          <div>
            <div class="font-medium text-slate-800 group-hover:text-emerald-700 text-sm">${escapeHtml(acc.name)}</div>
            <div class="text-xs text-slate-400 mt-0.5">${escapeHtml(acc.category)}</div>
          </div>
          <span class="text-slate-300 group-hover:text-emerald-500 text-sm">➔</span>
        `;
        button.onclick = () => selectAccount(acc.name);
        root.appendChild(button);
      });
    }

    async function selectAccount(accountName) {
      if (!liffReady) {
        alert('LIFF 尚未初始化完成，暫時不能將帳戶名稱送回 LINE。');
        return;
      }

      try {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        await liff.sendMessages([{ type: 'text', text: accountName }]);
        setStatus(`已送出帳戶：${accountName}`);

        if (liff.isInClient()) {
          liff.closeWindow();
        } else {
          alert('已送出帳戶名稱，但你目前不在 LINE 內建視窗，請手動關閉此頁面。');
        }
      } catch (err) {
        console.error('送出帳戶失敗', err);
        alert('送出帳戶失敗，請再試一次。\n若持續失敗，請檢查 LIFF ID、Scope、以及是否由 LINE 對話內開啟。');
      }
    }

    function setStatus(text, isWarn = false) {
      const el = document.getElementById('statusBar');
      el.textContent = text;
      el.className = isWarn ? 'mt-2 text-xs text-amber-600' : 'mt-2 text-xs text-slate-500';
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    window.onload = main;
  </script>
</body>
</html>
