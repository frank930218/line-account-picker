<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>選擇帳戶</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { max-width: 38rem; margin: auto; padding: 1rem; font: 16px system-ui, sans-serif; background: #f8fafc; color: #1e293b; }
    input { box-sizing: border-box; width: 100%; padding: .8rem; border: 1px solid #cbd5e1; border-radius: .6rem; font: inherit; }
    button { display: block; box-sizing: border-box; width: 100%; margin: .5rem 0; padding: .85rem; text-align: left; border: 1px solid #cbd5e1; border-radius: .6rem; background: white; font: inherit; }
    button:hover { background: #ecfdf5; }
    small { display: block; color: #64748b; }
    #status { min-height: 2rem; color: #475569; }
  </style>
</head>
<body>
  <h1>選擇帳戶</h1>
  <p id="status">正在讀取帳戶清單…</p>
  <input id="search" type="search" placeholder="搜尋帳戶或分類" aria-label="搜尋帳戶">
  <div id="accounts"></div>
  <script>
    const LIFF_ID = '2012182113-Is0rZCfR';
    const ACCOUNT_API_BASE = 'https://script.google.com/macros/s/AKfycbyBZybZf64r0734nbE0kd3-twXyGFGk-mPTRUUDeWsxoTkUpaxzasxZC-nln9aJtg5L/exec';
    let accounts = [];
    let liffReady = false;

    function status(message) { document.getElementById('status').textContent = message; }

    function render() {
      const query = document.getElementById('search').value.trim().toLowerCase();
      const container = document.getElementById('accounts');
      container.replaceChildren();
      accounts.filter(item => (item.name + ' ' + item.category).toLowerCase().includes(query)).forEach(item => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = item.name;
        const category = document.createElement('small');
        category.textContent = item.category;
        button.appendChild(category);
        button.addEventListener('click', () => selectAccount(item.name));
        container.appendChild(button);
      });
    }

    async function selectAccount(name) {
      if (!liffReady) { status('LIFF 尚未就緒，無法傳送帳戶。'); return; }
      try {
        if (!liff.isLoggedIn()) { liff.login(); return; }
        await liff.sendMessages([{ type: 'text', text: name }]);
        status('已送出帳戶：' + name);
        if (liff.isInClient()) liff.closeWindow();
      } catch (error) {
        status('送出失敗，請確認 LIFF 設定後重試。');
      }
    }

    async function main() {
      document.getElementById('search').addEventListener('input', render);
      try { await liff.init({ liffId: LIFF_ID }); liffReady = true; }
      catch (error) { status('LIFF 初始化失敗；可檢視帳戶，但無法傳送。'); }
      const callbackName = 'receiveAccountsFromGas';
      window[callbackName] = payload => {
        if (!payload || !payload.ok || !Array.isArray(payload.items)) { status('帳戶資料格式不正確。'); return; }
        accounts = payload.items.filter(item => item && item.name).map(item => ({ name: String(item.name), category: String(item.category || '未分類') }));
        status('已載入 ' + accounts.length + ' 筆帳戶。');
        render();
      };
      const script = document.createElement('script');
      script.src = ACCOUNT_API_BASE + '?action=accounts&callback=' + callbackName + '&_=' + Date.now();
      script.onerror = () => status('無法讀取動態帳戶清單，請稍後重試。');
      document.body.appendChild(script);
    }

    main();
  </script>
</body>
</html>
